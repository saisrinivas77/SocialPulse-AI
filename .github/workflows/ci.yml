name: SocialPulse AI CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          PYTHONPATH: .
          POSTGRES_SERVER: localhost
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: socialpulse_db
          REDIS_HOST: localhost
          SECRET_KEY: test-secret-key-1234567890-test-secret-key
          ENCRYPTION_KEY: Og5Bz9Qj_SMzJFYR_pd1Ogn7SXZ8CQGvoww0FsZQT30=
          AWS_ACCESS_KEY_ID: mock_key
          AWS_SECRET_ACCESS_KEY: mock_secret
        run: |
          python -m pytest tests/

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build Next.js Application
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.socialpulse.ai/api/v1
          NEXT_PUBLIC_APP_NAME: SocialPulse AI
          CI: false
        run: npm run build
